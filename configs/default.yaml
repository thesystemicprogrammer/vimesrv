server:
  host: "127.0.0.1"
  port: 8080
  shutdown_timeout_seconds: 30

auth:
  enabled: true
  username: "admin"
  password_hash: "$2b$10$3zhB4VenQZIilXXF08.mLuoIVirODb9EXEQbyVgKXEGcI2DN.oFmO" # default: admin123
  jwt_secret: "vimesrv-default-secret-change-in-production" # Override with AUTH_JWT_SECRET env var
  token_expiry_hours: 24
  stream_token_mins: 60

job:
  worker_count: 2
  polling_interval_in_seconds: 2
  scheduler_batch: 5
  scheduler_interval_in_seconds: 2
  max_attempts: 3
  backoff_base_seconds: 2
  backoff_max_seconds: 300
  stuck_job_threshold_minutes: 480 # 8 hours - jobs running longer are considered stuck
  stuck_job_check_interval_minutes: 5 # Check for stuck jobs every 5 minutes

media:
  library_path: "./library"
  media_path: "./media"
  staging_path: "./staging"
  trash_path: "/trash" # subdirectory under the library_path
  transcode_output_pattern: "{media_path}/{media_id}/transcoded" # Pattern for transcode output directory
  ffprobe_timeout_seconds: 30
  transcode_timeout_seconds: 7200 # 2 hours default for video transcoding
  supported_formats:
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".mov"
    - ".webm"
    - ".flv"
    - ".wmv"
    - ".m4v"
  library_scan:
    enabled: true
    cron_spec: "0 0 3 * * *" # Daily at 3:00 AM (6-field format: sec min hour day month weekday)
    priority: 0

transcoding:
  segment_duration: 4
  progress_log_interval_seconds: 60 # Log transcode progress every 60 seconds

  # Video encoder to use for transcoding
  # Software encoders: "libx264" (default), "libx265"
  # Hardware encoders: "h264_vaapi", "h264_qsv", "h264_nvenc", "h264_amf", "h264_videotoolbox"
  # Note: Hardware encoders require appropriate ffmpeg_input_args for HW acceleration setup
  video_encoder: "libx264"

  # Scale filter mode: "auto", "software", "vaapi", "qsv"
  # "auto" (default): Automatically select based on video_encoder
  #   - h264_vaapi -> scale_vaapi
  #   - h264_qsv -> scale_qsv
  #   - others -> software scale
  # "software": Always use CPU-based scaling (scale=W:H)
  # "vaapi": Use VAAPI hardware scaling (scale_vaapi=w=W:h=H)
  # "qsv": Use Intel QSV hardware scaling (scale_qsv=w=W:h=H)
  scale_filter: "auto"

  # Encoder preset (varies by encoder)
  # For libx264/libx265: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
  # For h264_nvenc: p1-p7 (p1=fastest, p7=slowest) or legacy: slow, medium, fast
  # For h264_vaapi/h264_qsv: Not used (ignored)
  encoder_preset: "medium"

  # Additional FFmpeg arguments to add before -i input
  # Useful for hardware acceleration, e.g.:
  #   ffmpeg_input_args: ["-hwaccel", "cuda"]
  #   ffmpeg_input_args: ["-hwaccel", "qsv", "-qsv_device", "/dev/dri/renderD128"]
  #   ffmpeg_input_args: ["-hwaccel", "vaapi", "-hwaccel_device", "/dev/dri/renderD128", "-hwaccel_output_format", "vaapi"]
  ffmpeg_input_args: []

  # Quality presets using CRF-based encoding
  # Set enabled: true to create transcodes for that quality
  # CRF (Constant Rate Factor): Lower = better quality but larger files
  #   18-20 = Near-lossless quality
  #   21-23 = Excellent quality
  #   24-26 = Good quality
  quality_profiles:
    - name: "360p"
      enabled: true
      resolution: "640x360"
      crf: 25
      max_bitrate: "900k"
      audio_bitrate: "96k"

    - name: "480p"
      enabled: true
      resolution: "854x480"
      crf: 24
      max_bitrate: "1500k"
      audio_bitrate: "128k"

    - name: "720p"
      enabled: false
      resolution: "1280x720"
      crf: 23
      max_bitrate: "2800k"
      audio_bitrate: "128k"

    - name: "900p"
      enabled: false
      resolution: "1600x900"
      crf: 22
      max_bitrate: "4500k"
      audio_bitrate: "128k"

    - name: "1080p"
      enabled: false
      resolution: "1920x1080"
      crf: 21
      max_bitrate: "5500k"
      audio_bitrate: "192k"

    - name: "1440p"
      enabled: false
      resolution: "2560x1440"
      crf: 20
      max_bitrate: "9000k"
      audio_bitrate: "192k"

    - name: "2160p"
      enabled: false
      resolution: "3840x2160"
      crf: 18
      max_bitrate: "16000k"
      audio_bitrate: "256k"

database:
  path: "./data/vimesrv.db"

logging:
  level: "info"
  format: "console"
  file: "" # Empty = stdout only; set a path to enable file logging
  max_size_mb: 100 # Rotate when file exceeds this size (MB)
  max_age_days: 7 # Delete logs older than this (days, 0 = no limit)
  max_backups: 5 # Max number of old log files to keep (0 = no limit)
  compress: true # Compress rotated logs with gzip
  local_time: true # Use local timezone for backup filenames
  rotate_at: "00:00" # Daily rotation time in HH:MM 24-hour format (empty = disabled)

tmdb:
  enabled: false # Set to true and provide TMDB_API_KEY environment variable to enable
  api_key: "" # Set via TMDB_API_KEY environment variable
  language: "en-US"
  auto_search: true
  auto_link_threshold: 70
  max_candidates: 5
  image_cache_path: "./cache/tmdb"
  download_images: true
  poster_size: "w500"
  backdrop_size: "w1280"
  profile_size: "w185" # Profile photo size for cast/crew
  requests_per_10s: 35
  max_cast_members: 10 # Number of top cast members to store (1-50)
  similar_content_count: 5 # Number of similar movies/series to show (2-12)
  cache_ttl_hours: 168 # TTL for cached data like similar content (1 week)

library:
  recently_added_count: 20 # Number of items to show in "Recently Added" section

websocket:
  enabled: true
  ping_interval_seconds: 30
  pong_timeout_seconds: 10
  write_timeout_seconds: 10
  max_message_size_bytes: 512

# Database rebuild configuration
# Use --prepare-rebuild to export users and metadata links before a breaking upgrade
# Use --rebuild-from-dump to restore from the exported data after upgrade
rebuild:
  allow_rebuild: false # Must be set to true to enable --rebuild-from-dump
  tmdb_requests_per_10s: 15 # Conservative rate limit during rebuild (default TMDB limit is 35)
  # Automatic rebuild.json export (backup of users and TMDB link mappings)
  periodic_export:
    enabled: true
    cron_spec: "0 0 * * * *" # Every hour (6-field format: sec min hour day month weekday)
    run_at_startup: true # Also run immediately on server start
    priority: 10 # Low priority (higher number = lower priority)

# Distributed transcoding worker configuration
# When enabled, transcode jobs are processed exclusively by remote workers
# Workers must have access to the same media library (e.g., via NFS)
worker:
  enabled: false # Enable worker API and exclusive worker processing
  auth_token: "" # Shared secret for worker authentication (set via WORKER_AUTH_TOKEN env var)
  heartbeat_timeout_seconds: 60 # Worker considered dead if no heartbeat/progress within this time
  fallback_to_local: false # Process locally when no workers are available
  fallback_after_minutes: 30 # Wait time before local fallback (if enabled)
