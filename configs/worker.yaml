# vimesrv-worker Configuration
# =============================
# This is the configuration file for the distributed transcoding worker.
# The worker connects to the main vimesrv server and processes transcode jobs.

# Server connection settings
server:
  # URL of the main vimesrv server
  url: "http://localhost:8080"

  # Authentication token - MUST match the server's worker.auth_token
  # This is a shared secret for worker authentication
  # Generate a secure token: openssl rand -hex 32
  auth_token: ""

# Worker settings
worker:
  # Unique worker ID (leave empty to auto-generate UUID on startup)
  id: ""

  # Human-readable name for this worker (shown in logs and UI)
  name: "worker-1"

  # How often to poll server for new jobs (in seconds)
  poll_interval_seconds: 5

  # How often to send heartbeat when idle (in seconds)
  # Must be less than server's worker.heartbeat_timeout_seconds
  heartbeat_interval_seconds: 30

  # Maximum number of concurrent transcode jobs
  # Adjust based on CPU/GPU resources available
  concurrency: 2

  # How often to report progress during transcoding (in seconds)
  progress_interval_seconds: 5

# Media library settings
media:
  # Path to the media library ON THIS WORKER
  # This path should point to where the media library is mounted locally.
  # The server sends relative paths which are resolved against this path.
  # IMPORTANT: This directory must exist and be accessible
  media_path: "/mnt/nfs/video/library/media"

# Transcoding settings
transcoding:
  # Path to FFmpeg binary (default: searches PATH)
  ffmpeg_path: "ffmpeg"

  # Path to FFprobe binary (default: searches PATH)
  ffprobe_path: "ffprobe"

  # Maximum time for a single transcode job (in seconds)
  # Default: 7200 (2 hours)
  timeout_seconds: 7200

  # Video encoder to use for transcoding
  # Software encoders: "libx264" (default), "libx265"
  # Hardware encoders: "h264_vaapi", "h264_qsv", "h264_nvenc", "h264_amf", "h264_videotoolbox"
  # Note: Hardware encoders require appropriate ffmpeg_input_args for HW acceleration setup
  # If empty, uses the encoder specified by the server in the job
  video_encoder: ""

  # Scale filter mode: "auto", "software", "vaapi", "qsv"
  # "auto" (default): Automatically select based on video_encoder
  #   - h264_vaapi -> scale_vaapi
  #   - h264_qsv -> scale_qsv
  #   - others -> software scale
  # "software": Always use CPU-based scaling (scale=W:H)
  # "vaapi": Use VAAPI hardware scaling (scale_vaapi=w=W:h=H)
  # "qsv": Use Intel QSV hardware scaling (scale_qsv=w=W:h=H)
  scale_filter: "auto"

  # Encoder preset (varies by encoder)
  # For libx264/libx265: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow
  # For h264_nvenc: p1-p7 (p1=fastest, p7=slowest) or legacy: slow, medium, fast
  # For h264_vaapi/h264_qsv: Not used (ignored)
  # If empty, uses the preset specified by the server in the job
  encoder_preset: ""

  # Additional FFmpeg arguments to add before -i input
  # Useful for hardware acceleration, e.g.:
  #   ffmpeg_input_args: ["-hwaccel", "cuda"]
  #   ffmpeg_input_args: ["-hwaccel", "qsv", "-qsv_device", "/dev/dri/renderD128"]
  #   ffmpeg_input_args: ["-hwaccel", "vaapi", "-hwaccel_device", "/dev/dri/renderD128", "-hwaccel_output_format", "vaapi"]
  ffmpeg_input_args: []

# Logging settings
logging:
  # Log level: debug, info, warn, error
  level: "info"

  # Log format: console (human-readable) or json
  format: "console"
