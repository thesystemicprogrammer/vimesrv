<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto HLS / DASH Player</title>

  <!-- dash.js (DASH playback) -->
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <!-- hls.js (HLS playback for non-Safari browsers) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 900px;
      background: black;
    }
    #info {
      margin-top: 12px;
      font-size: 0.9em;
      color: #444;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<h2>Auto-selecting Video Player</h2>

<video id="video" controls playsinline></video>

<div id="info"></div>

<script>
/* ============================
   Hardcoded stream URLs
   ============================ */
const DASH_URL = "http://localhost:8080/stream/dash/7a8c0dbe80eb915add9c1efe6df47e68/manifest.mpd"
const HLS_URL  = "http://localhost:8080/stream/hls/7a8c0dbe80eb915add9c1efe6df47e68/master.m3u8";
const MP4_URL  = "https://example.com/media/movie1/original/source.mp4";

/* ============================
   Helpers
   ============================ */
const video = document.getElementById("video");
const info  = document.getElementById("info");

function log(msg) {
  info.innerHTML += msg + "<br>";
}

/* ============================
   Capability detection
   ============================ */

// DASH requires Media Source Extensions (MSE)
const supportsMSE =
  window.MediaSource &&
  typeof MediaSource.isTypeSupported === "function";

// Native HLS (Safari)
const supportsNativeHLS =
  video.canPlayType("application/vnd.apple.mpegurl") !== "";

// HLS via JavaScript
const supportsHLSJS =
  window.Hls && Hls.isSupported();

/* ============================
   Playback selection
   ============================ */

if (supportsMSE) {
  log("Using DASH (Media Source Extensions supported)");
  const player = dashjs.MediaPlayer().create();
  
  // Add detailed event listeners for debugging
  player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
    console.error("[DASH] Error:", e);
    log("Error: " + JSON.stringify(e.error));
  });
  
  player.on(dashjs.MediaPlayer.events.PLAYBACK_ERROR, function(e) {
    console.error("[DASH] Playback error:", e);
  });
  
  player.on(dashjs.MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, function(e) {
    console.log("[DASH] Fragment loaded:", e.request.url);
  });
  
  player.on(dashjs.MediaPlayer.events.BUFFER_LOADED, function(e) {
    console.log("[DASH] Buffer loaded for", e.mediaType);
  });

  // Configure player for better seeking
  player.updateSettings({
    streaming: {
      buffer: {
        fastSwitchEnabled: true,
        flushBufferAtTrackSwitch: false,
        reuseExistingSourceBuffers: true,
        bufferPruningInterval: 10,
        bufferToKeep: 20
      },
      gaps: {
        jumpGaps: true,
        jumpLargeGaps: true,
        smallGapLimit: 0.5
      },
      abr: {
        autoSwitchBitrate: {
          video: true
        }
      }
    }
  });
  
  player.initialize(video, DASH_URL, true);

} else if (supportsNativeHLS) {
  log("Using native HLS (Safari)");
  video.src = HLS_URL;

} else if (supportsHLSJS) {
  log("Using HLS via hls.js");
  const hls = new Hls();
  hls.loadSource(HLS_URL);
  hls.attachMedia(video);

} else {
  log("Falling back to MP4");
  video.src = MP4_URL;
}
</script>

</body>
</html>
