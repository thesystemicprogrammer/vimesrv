<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Film Reel - Outer Ring -->
  <circle cx="32" cy="32" r="28" stroke="#3B82F6" stroke-width="3" fill="none"/>
  
  <!-- Sprocket Holes - 6 around the edge -->
  <circle cx="32" cy="8" r="4" fill="#3B82F6"/>
  <circle cx="52.8" cy="20" r="4" fill="#3B82F6"/>
  <circle cx="52.8" cy="44" r="4" fill="#3B82F6"/>
  <circle cx="32" cy="56" r="4" fill="#3B82F6"/>
  <circle cx="11.2" cy="44" r="4" fill="#3B82F6"/>
  <circle cx="11.2" cy="20" r="4" fill="#3B82F6"/>
  
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="14" stroke="#3B82F6" stroke-width="2" fill="none"/>
  
  <!-- Play Button - centered, slightly offset right for visual balance -->
  <polygon points="28,22 28,42 44,32" fill="#3B82F6"/>
</svg>
