<div 
  class="bottom-controls"
  [class.hidden]="!visible && isPlaying">
  
  <!-- Progress Bar -->
  <div 
    class="progress-bar-container"
    (click)="onSeek($event)"
    #progressBar>
    <div 
      class="progress-bar-fill"
      [style.width.%]="progress">
      <div class="progress-bar-handle"></div>
    </div>
  </div>

  <!-- Controls Row -->
  <div class="controls-row">
    <!-- Play/Pause -->
    <button 
      class="control-btn"
      (click)="onTogglePlay($event)">
      @if (isPlaying) {
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      }
    </button>

    <!-- Volume -->
    <div class="volume-control">
      <button 
        class="control-btn"
        (click)="onToggleMute($event)">
        @if (isMuted || volume === 0) {
          <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        }
      </button>
      <input
        type="range"
        min="0"
        max="1"
        step="0.1"
        [value]="volume"
        (input)="onVolumeSliderChange($event)"
        class="volume-slider"
      />
    </div>

    <!-- Time Display -->
    <div class="time-display">
      {{ formatTime(currentTime) }} / {{ formatTime(duration) }}
    </div>

    <!-- Playback Mode Indicator -->
    @if (playbackModeLabel) {
      <div class="mode-badge"
           [class.mode-adaptive]="playbackModeLabel === 'Adaptive'"
           [class.mode-direct]="playbackModeLabel !== 'Adaptive'">
        {{ playbackModeLabel }}
      </div>
    }

    <!-- Spacer -->
    <div class="spacer"></div>

    <!-- Audio Track Selector -->
    @if (audioTracks.length > 1) {
      <div class="track-selector">
        <label class="track-label">Audio:</label>
        <select
          class="track-select"
          [value]="currentAudioIndex"
          (change)="onAudioChange($event)">
          @for (track of audioTracks; track track.index; let i = $index) {
            <option [value]="i">
              {{ track.title || track.language || 'Track ' + (i + 1) }}
            </option>
          }
        </select>
      </div>
    }

    <!-- Subtitle Track Selector -->
    @if (subtitleTracks.length > 0) {
      <div class="track-selector">
        <label class="track-label">Subtitles:</label>
        <select
          class="track-select"
          [value]="currentSubtitleIndex"
          (change)="onSubtitleChange($event)">
          <option value="-1">Off</option>
          @for (track of subtitleTracks; track track.index; let i = $index) {
            <option [value]="i">
              {{ track.title || track.language || 'Track ' + (i + 1) }}
            </option>
          }
        </select>
      </div>
    }

    <!-- Quality Selector -->
    @if (qualityLevels.length > 1) {
      <div class="track-selector">
        <label class="track-label">Quality:</label>
        <select
          class="track-select"
          [value]="currentQualityIndex"
          (change)="onQualityChange($event)">
          <option value="-1">Auto</option>
          @for (quality of qualityLevels; track quality.index; let i = $index) {
            <option [value]="i">
              {{ quality.height }}p
            </option>
          }
        </select>
      </div>
    }

    <!-- Fullscreen -->
    <button 
      class="control-btn"
      (click)="onToggleFullscreen()">
      @if (isFullscreen) {
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="icon-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      }
    </button>
  </div>
</div>
