<div 
  class="center-controls-container"
  [class.hidden]="!visible">
  
  <!-- Skip Back Button -->
  <button 
    class="control-button control-button-small"
    (click)="onSkipBack($event)"
    aria-label="Skip back">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M9.195 18.44c1.25.713 2.805-.19 2.805-1.629v-2.34l6.945 3.968c1.25.714 2.805-.188 2.805-1.628V8.688c0-1.44-1.555-2.342-2.805-1.628L12 11.03v-2.34c0-1.44-1.555-2.343-2.805-1.629l-7.108 4.062c-1.26.72-1.26 2.536 0 3.256l7.108 4.061z"/>
    </svg>
  </button>
  
  <!-- Play/Pause Button -->
  <button 
    class="control-button control-button-large"
    (click)="onPlayPause($event)"
    [attr.aria-label]="isPlaying ? 'Pause' : 'Play'">
    @if (isPlaying) {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
        <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0A.75.75 0 0115 4.5h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
        <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd"/>
      </svg>
    }
  </button>
  
  <!-- Skip Forward Button -->
  <button 
    class="control-button control-button-small"
    (click)="onSkipForward($event)"
    aria-label="Skip forward">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M14.805 18.44c-1.25.713-2.805-.19-2.805-1.629v-2.34l-6.945 3.968c-1.25.714-2.805-.188-2.805-1.628V8.688c0-1.44 1.555-2.342 2.805-1.628L12 11.03v-2.34c0-1.44 1.555-2.343 2.805-1.629l7.108 4.062c1.26.72 1.26 2.536 0 3.256l-7.108 4.061z"/>
    </svg>
  </button>
</div>
