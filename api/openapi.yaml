  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        Returns a list of jobs. Requires admin or manager role.
        By default returns active jobs (running/queued) plus completed/failed jobs from the last 24 hours.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (comma-separated, e.g., "running,queued")
          schema:
            type: string
        - name: type
          in: query
          description: Filter by job type (comma-separated, e.g., "transcode_video,scan_library")
          schema:
            type: string
        - name: include_old
          in: query
          description: Include jobs older than 24 hours
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Job list
          content:
