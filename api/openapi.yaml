openapi: 3.0.3
info:
  title: VimeSrv API
  description: REST API for VimeSrv - Home network video media server with DASH/HLS transcoding
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management (admin only)
  - name: Media
    description: Media file management
  - name: Metadata
    description: TMDB metadata enrichment
  - name: Library
    description: Library scanning and browsing
  - name: Jobs
    description: Job monitoring (admin/manager only)
  - name: Streaming
    description: DASH streaming endpoints
  - name: Worker
    description: Distributed transcoding worker API (requires worker auth token)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API token obtained from /api/v1/auth/login
    StreamAuth:
      type: apiKey
      in: query
      name: token
      description: Short-lived stream token obtained from /api/v1/auth/stream-token
    WorkerAuth:
      type: http
      scheme: bearer
      description: Worker authentication token configured in server's worker.auth_token setting

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "INVALID_REQUEST"
            message:
              type: string
              example: "Invalid request body"
            details:
              type: object

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "admin123"

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: JWT token for API authentication
            expires_in:
              type: integer
              description: Token expiry time in seconds
              example: 86400
            must_change_password:
              type: boolean
              description: If true, user must change password before accessing other endpoints

    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            username:
              type: string
              example: "admin"
            user_id:
              type: string
              description: User ID (only for database users)
            role:
              type: string
              enum: [admin, manager, user]
              description: User role
            must_change_password:
              type: boolean
              description: If true, user must change password

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 6

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          example: "newuser"
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, manager, user]

    UpdateUserRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [admin, manager, user]

    ResetPasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 6

    UserDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum: [admin, manager, user]
            must_change_password:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    UsersListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              username:
                type: string
              role:
                type: string
                enum: [admin, manager, user]
              must_change_password:
                type: boolean
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time

    StreamTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
              description: Short-lived JWT token for streaming URLs
            expires_in:
              type: integer
              description: Token expiry time in seconds
              example: 3600

    MediaListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MediaSummary'
            total:
              type: integer
            page:
              type: integer
            per_page:
              type: integer

    MediaSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [pending, processing, ready, failed]
        duration:
          type: number
          description: Duration in seconds

    MediaDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MediaDetail'

    MediaDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        filename:
          type: string
        duration:
          type: number
        resolution:
          type: string
          example: "1080p"
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
        dash_manifest_url:
          type: string
          example: "/stream/dash/{id}/manifest.mpd"
        audio_streams:
          type: array
          items:
            $ref: '#/components/schemas/AudioStream'
        subtitle_streams:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleStream'
        available_qualities:
          type: array
          items:
            type: string
          example: ["1080p", "720p", "480p"]

    AudioStream:
      type: object
      properties:
        index:
          type: integer
        language:
          type: string
          example: "eng"
        title:
          type: string
          example: "English"
        channels:
          type: integer
          example: 2

    SubtitleStream:
      type: object
      properties:
        index:
          type: integer
        language:
          type: string
          example: "eng"
        title:
          type: string
          example: "English"

    CandidatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetadataCandidate'

    MetadataCandidate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tmdb_id:
          type: integer
        media_type:
          type: string
          enum: [movie, tv]
        title:
          type: string
        release_date:
          type: string
        confidence:
          type: number
          description: Match confidence score (0-100)
        poster_url:
          type: string

    LinkRequest:
      type: object
      required:
        - candidate_id
      properties:
        candidate_id:
          type: integer
          format: int64

    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: "The Matrix"
        year:
          type: integer
          example: 1999
        media_type:
          type: string
          enum: [movie, tv]
          description: Filter by media type (optional)
        max_results:
          type: integer
          default: 10
        language:
          type: string
          description: Language code for search results (e.g., "en", "de"). Falls back to server default if not provided.
          example: "en"

    SearchResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            media_id:
              type: string
            query:
              type: string
            results:
              type: array
              items:
                $ref: '#/components/schemas/SearchResult'
            count:
              type: integer

    SearchResult:
      type: object
      properties:
        tmdb_id:
          type: integer
        media_type:
          type: string
          enum: [movie, tv]
        title:
          type: string
        original_title:
          type: string
        release_date:
          type: string
        overview:
          type: string
        poster_url:
          type: string

    LinkSearchRequest:
      type: object
      required:
        - tmdb_id
        - media_type
      properties:
        tmdb_id:
          type: integer
        media_type:
          type: string
          enum: [movie, tv]
        season_number:
          type: integer
          description: For TV episodes
        episode_number:
          type: integer
          description: For TV episodes

    ScanJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            job_id:
              type: integer
              format: int64

    SuccessResponse:
      type: object
      properties:
        data:
          type: object

    # Library Browsing Schemas
    MovieSummary:
      type: object
      properties:
        media_id:
          type: string
        duration:
          type: integer
        resolution:
          type: string
        status:
          type: string
        enrichment_status:
          type: string
        created_at:
          type: string
        transcode_status:
          type: string
          enum: [none, pending, completed]
        movie_metadata_id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: string
        poster_path:
          type: string
        backdrop_path:
          type: string
        vote_average:
          type: number
        genres:
          type: string

    SeriesSummary:
      type: object
      properties:
        series_metadata_id:
          type: integer
          format: int64
        tmdb_id:
          type: integer
        name:
          type: string
        year:
          type: string
        poster_path:
          type: string
        backdrop_path:
          type: string
        vote_average:
          type: number
        genres:
          type: string
        number_of_seasons:
          type: integer
        number_of_episodes:
          type: integer
        available_episodes:
          type: integer

    EpisodeSummary:
      type: object
      properties:
        media_id:
          type: string
        duration:
          type: integer
        status:
          type: string
        transcode_status:
          type: string
        episode_metadata_id:
          type: integer
          format: int64
        season_number:
          type: integer
        episode_number:
          type: integer
        name:
          type: string
        overview:
          type: string
        air_date:
          type: string
        still_path:
          type: string
        vote_average:
          type: number

    SeasonSummary:
      type: object
      properties:
        season_metadata_id:
          type: integer
          format: int64
        season_number:
          type: integer
        name:
          type: string
        overview:
          type: string
        poster_path:
          type: string
        air_date:
          type: string
        episode_count:
          type: integer
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeSummary'

    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/SeriesSummary'
        - type: object
          properties:
            overview:
              type: string
            seasons:
              type: array
              items:
                $ref: '#/components/schemas/SeasonSummary'
            similar_series:
              type: array
              items:
                $ref: '#/components/schemas/SimilarSeriesItem'

    SimilarMovieItem:
      type: object
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        poster_path:
          type: string
        release_date:
          type: string
        year:
          type: string
        vote_average:
          type: number
        in_library:
          type: boolean
        media_id:
          type: string
          description: Set if in_library is true

    SimilarSeriesItem:
      type: object
      properties:
        tmdb_id:
          type: integer
        name:
          type: string
        poster_path:
          type: string
        first_air_date:
          type: string
        year:
          type: string
        vote_average:
          type: number
        in_library:
          type: boolean
        series_metadata_id:
          type: integer
          format: int64
          description: Set if in_library is true

    CollectionMovieItem:
      type: object
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        poster_path:
          type: string
        release_date:
          type: string
        year:
          type: string
        vote_average:
          type: number
        in_library:
          type: boolean
        media_id:
          type: string
          description: Set if in_library is true
        is_current:
          type: boolean
          description: True if this is the movie being viewed

    MovieCollectionInfo:
      type: object
      properties:
        collection_id:
          type: integer
        name:
          type: string
        overview:
          type: string
        poster_path:
          type: string
        backdrop_path:
          type: string
        movies:
          type: array
          items:
            $ref: '#/components/schemas/CollectionMovieItem'
        position:
          type: integer
          description: 1-based position of current movie in collection
        total_movies:
          type: integer

    CreditPerson:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tmdb_person_id:
          type: integer
        name:
          type: string
        character:
          type: string
        job:
          type: string
        profile_path:
          type: string

    MovieDetail:
      allOf:
        - $ref: '#/components/schemas/MovieSummary'
        - type: object
          properties:
            original_title:
              type: string
            tagline:
              type: string
            overview:
              type: string
            release_date:
              type: string
            runtime:
              type: integer
            movie_status:
              type: string
            imdb_id:
              type: string
            tmdb_id:
              type: integer
            certification:
              type: string
            cast:
              type: array
              items:
                $ref: '#/components/schemas/CreditPerson'
            directors:
              type: array
              items:
                $ref: '#/components/schemas/CreditPerson'
            crew:
              type: array
              items:
                $ref: '#/components/schemas/CreditPerson'
            similar_movies:
              type: array
              items:
                $ref: '#/components/schemas/SimilarMovieItem'
            collection:
              $ref: '#/components/schemas/MovieCollectionInfo'

    MovieDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MovieDetail'

    UnmatchedMediaSummary:
      type: object
      properties:
        media_id:
          type: string
        filename:
          type: string
        title:
          type: string
        duration:
          type: integer
        resolution:
          type: string
        enrichment_status:
          type: string
        created_at:
          type: string

    MoviesListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MovieSummary'
            total:
              type: integer
            page:
              type: integer
            per_page:
              type: integer

    SeriesListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SeriesSummary'

    SeriesDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SeriesDetail'

    RecentListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MovieSummary'

    UnmatchedListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UnmatchedMediaSummary'
            total:
              type: integer
            page:
              type: integer
            per_page:
              type: integer

    # Job Schemas
    Job:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [scan_library, transcode_video, enrich_metadata, fetch_translations]
        status:
          type: string
          enum: [queued, running, succeeded, dead]
        payload:
          type: object
          description: Job-specific payload data
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    JobListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/Job'
            total:
              type: integer

    # Worker API Schemas
    WorkerRegisterRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string
          description: Unique identifier for the worker
          example: "worker-1"
        name:
          type: string
          description: Human-readable worker name
          example: "Transcode Worker 1"
        capacity:
          type: integer
          description: Maximum concurrent jobs this worker can handle
          example: 4

    WorkerHeartbeatRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string
        name:
          type: string
        active_jobs:
          type: integer
          description: Number of jobs currently being processed
        capacity:
          type: integer
          description: Maximum concurrent jobs

    WorkerHeartbeatResponse:
      type: object
      properties:
        ok:
          type: boolean
        server_time:
          type: integer
          format: int64
          description: Server timestamp (Unix seconds)
        queued_jobs:
          type: integer
          description: Number of jobs waiting in queue

    WorkerClaimRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string

    WorkerClaimResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/WorkerJob'
          nullable: true
          description: Job details or null if no jobs available

    WorkerJob:
      type: object
      properties:
        job_id:
          type: integer
          format: int64
        transcode_id:
          type: string
          description: Unique transcode session identifier
        track_type:
          type: string
          enum: [video, audio, subtitle]
        track_index:
          type: integer
          description: Source stream index in media file
        quality:
          type: string
          description: Quality level (for video tracks)
          example: "1080p"
        input_path:
          type: string
          description: Absolute path to source media file
        output_path:
          type: string
          description: Absolute path to output directory/file
        media_duration:
          type: number
          description: Total duration in seconds
        transcode_options:
          $ref: '#/components/schemas/WorkerTranscodeOptions'

    WorkerTranscodeOptions:
      type: object
      properties:
        width:
          type: integer
          description: Output video width
        height:
          type: integer
          description: Output video height
        video_codec:
          type: string
          description: FFmpeg video codec
          example: "libx264"
        crf:
          type: integer
          description: Constant Rate Factor (quality)
        max_bitrate:
          type: integer
          description: Maximum bitrate in bits/second
        preset:
          type: string
          description: FFmpeg encoding preset
          example: "medium"
        audio_codec:
          type: string
          description: FFmpeg audio codec
          example: "aac"
        audio_bitrate:
          type: integer
          description: Audio bitrate in bits/second
        segment_time:
          type: integer
          description: DASH segment duration in seconds

    WorkerProgressRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string
        percentage:
          type: number
          description: Completion percentage (0-100)
        speed:
          type: string
          description: Encoding speed (e.g., "2.5x")
        eta_seconds:
          type: integer
          description: Estimated time remaining in seconds

    WorkerCompleteRequest:
      type: object
      required:
        - worker_id
      properties:
        worker_id:
          type: string
        segment_count:
          type: integer
          description: Number of segments produced
        output_files:
          type: array
          items:
            type: string
          description: List of output file names

    WorkerFailRequest:
      type: object
      required:
        - worker_id
        - error
      properties:
        worker_id:
          type: string
        error:
          type: string
          description: Error message
        retry:
          type: boolean
          description: Whether the job should be retried

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: Login with username and password to obtain a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request or auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns information about the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/stream-token:
    post:
      tags: [Auth]
      summary: Get stream token
      description: Generate a short-lived token for streaming URLs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Stream token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      description: Change the current user's password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request or password too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Returns all users (admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin access required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (admin access required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user
      description: Get a specific user by ID (admin only)
      security:
