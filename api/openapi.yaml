  /stream/dash/{id}/manifest.mpd:
    get:
      tags: [Streaming]
      summary: Get DASH manifest
      description: Returns the DASH MPD manifest for streaming
      security:
        - StreamAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: quality
          in: query
          description: Filter manifest by quality (e.g., 1080p, 720p)
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: Stream token
          schema:
            type: string
      responses:
        '200':
          description: DASH manifest
          content:
            application/dash+xml:
              schema:
                type: string
        '404':
          description: Media not found or no transcodes available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stream/dash/content/{id}/{path}:
    get:
      tags: [Streaming]
      summary: Serve DASH content
      description: |
        Serves DASH content segments including:
        - Video segments: `{quality}/video/{segment}` (e.g., `1080p/video/init.mp4`)
        - Audio segments: `audio-{idx}/{segment}` (e.g., `audio-0/chunk-001.m4s`)
        - Subtitles: `subtitle-{idx}.vtt`
      security:
        - StreamAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: Stream token
          schema:
            type: string
      responses:
        '200':
          description: Content segment
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/iso.segment:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/iso.segment:
              schema:
                type: string
                format: binary
            text/vtt:
              schema:
                type: string
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Worker API Endpoints
  /api/v1/worker/register:
    post:
      tags: [Worker]
      summary: Register worker
      description: |
        Register a new worker with the server. Workers must register before claiming jobs.
        This endpoint requires the worker auth token configured in the server.
      security:
        - WorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegisterRequest'
      responses:
        '200':
          description: Worker registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Worker API not enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/worker/heartbeat:
    post:
      tags: [Worker]
      summary: Send heartbeat
      description: |
        Send a heartbeat to indicate the worker is still alive.
        Workers should send heartbeats at regular intervals (e.g., every 30 seconds).
        The server uses heartbeats to detect dead workers and reassign their jobs.
      security:
        - WorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerHeartbeatResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/worker/jobs/claim:
    post:
      tags: [Worker]
      summary: Claim next job
      description: |
        Attempt to claim the next available job from the queue.
        Returns the job details if a job is available, or null if no jobs are queued.
        The worker must be registered before claiming jobs.
      security:
        - WorkerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerClaimRequest'
      responses:
        '200':
          description: Job claimed or no jobs available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerClaimResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/worker/jobs/{id}/progress:
    post:
      tags: [Worker]
      summary: Report job progress
      description: |
        Report progress on an active job.
        Workers should report progress at regular intervals during transcoding.
      security:
        - WorkerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerProgressRequest'
      responses:
        '200':
          description: Progress recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid request body or job ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/worker/jobs/{id}/complete:
    post:
      tags: [Worker]
      summary: Complete job
      description: |
        Mark a job as successfully completed.
        The server will validate the output files before accepting the completion.
      security:
        - WorkerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerCompleteRequest'
      responses:
        '200':
          description: Job completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid request or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/worker/jobs/{id}/fail:
    post:
      tags: [Worker]
      summary: Fail job
      description: |
        Mark a job as failed.
        If retry is true, the job will be re-queued for another attempt (up to max_attempts).
      security:
        - WorkerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerFailRequest'
      responses:
        '200':
          description: Job marked as failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid request body or job ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or missing auth token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
